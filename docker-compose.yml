services:
  fintracker-bot:
    build: .
    image: fintracker-bot:latest
    container_name: fintracker-bot
    restart: unless-stopped
    networks:
      - default
      - airafin
    volumes:
      - ./.env.local:/app/.env.local:ro
      - ./data:/app/data
      - ./secrets:/app/secrets:ro

networks:
  airafin:
    external: true
    name: airafin-dashboard_default
